services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plantsight
      POSTGRES_USER: plantsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantsight -d plantsight"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://plantsight:${POSTGRES_PASSWORD}@db:5432/plantsight
    ports:
      - "127.0.0.1:${API_PORT:-8370}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 接本機模型（例如 Ollama）時需要
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  pgdata:
